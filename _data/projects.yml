# One entry per public project, listed on the home page in this order,
# grouped by `group`.
#
#   repo:    GitHub repository name (under site.github_user)
#   title:   display name (defaults to repo)
#   summary: one or two sentences
#   lang:    primary language
#   page:    path of the project's page on this site; omit if there is none
#            yet, and the card links straight to GitHub
#   status:  optional short badge (e.g. "alpha")

groups:
  - Systems & networking
  - Displays & media
  - Astronomy & hardware
  - Developer & data tools

projects:
  - repo: replant
    title: Replant
    group: Systems & networking
    lang: Python
    page: /projects/replant/
    status: alpha
    summary: >-
      Turn a Clonezilla image of a Linux PC into a package that restores onto
      a disk of any size, smaller or larger than the original.

  - repo: monitor-dhcp-rust
    title: monitor-dhcp
    group: Systems & networking
    lang: Rust
    page: /projects/monitor-dhcp-rust/
    summary: >-
      Minimal, deterministic DHCPv4 server that gives a monitor on a
      dedicated Ethernet link the same known address every time.

  - repo: stassh-rust
    title: StaSSH
    group: Systems & networking
    lang: Rust
    page: /projects/stassh-rust/
    summary: >-
      Portable, offline-first SSH workspace: a CLI, a terminal UI and a
      desktop app over one local vault, running your system OpenSSH.

  - repo: philips-sicp-client
    group: Displays & media
    lang: Python
    summary: Dependency-free Python CLI and client library for Philips SICP displays.

  - repo: iiyama-control
    group: Displays & media
    lang: Python
    summary: Python CLI and client library for iiyama LHxx82S display control.

  - repo: viewsonic-lfd-control
    group: Displays & media
    lang: Python
    summary: Python CLI and client library for controlling ViewSonic CDE/LFD displays over TCP or RS-232.

  - repo: syncplayer
    title: Syncplayer
    group: Displays & media
    lang: Rust
    page: /projects/syncplayer/
    status: release candidate
    summary: >-
      Rust/GStreamer video player that keeps local media on several Linux
      PCs or Raspberry Pis in step with one Master timeline.

  - repo: gb-cplusplus
    title: GoBro
    group: Displays & media
    lang: C++
    page: /projects/gb-cplusplus/
    summary: >-
      Linux player and toolkit for GoPro MAX recordings: original .360
      playback, synced GPS telemetry and OpenStreetMap route, and video
      export with map and telemetry overlays.

  - repo: panopose-rust
    title: PanoPose
    group: Astronomy & hardware
    lang: Rust
    page: /projects/panopose-rust/
    summary: >-
      Linux desktop app for aligning 360° panoramas against the Sun, Moon,
      planets and stars, and exporting them as Stellarium landscapes.

  - repo: cardputer-adv-indi-controller
    title: Cardputer INDI Controller
    group: Astronomy & hardware
    lang: C++
    page: /projects/cardputer-adv-indi-controller/
    summary: >-
      Firmware that turns the M5Stack Cardputer ADV into a handheld Wi-Fi
      controller for telescope mounts and cameras on an INDI server.

  - repo: m5stickc-ble-clinometer
    title: M5 Bluetooth Clinometer
    group: Astronomy & hardware
    lang: Python
    page: /projects/m5stickc-ble-clinometer/
    summary: >-
      Firmware that turns M5Stack devices into a Bluetooth LE bubble level
      and telescope status display, with a Python client for scripting it.

  - repo: gitwatch-rust
    title: gitwatch
    group: Developer & data tools
    lang: Rust
    page: /projects/gitwatch-rust/
    summary: >-
      A live, read-only terminal viewer for uncommitted Git changes, made to
      sit beside a coding agent in a terminal, tmux or Byobu pane.

  - repo: api-almanac-rust
    title: API Almanac
    group: Developer & data tools
    lang: Rust
    page: /projects/api-almanac-rust/
    summary: >-
      Local-first desktop workbench and CLI for exploring, saving and
      rerunning HTTP API calls, kept as plain YAML files you own.

  - repo: curaflow
    title: Curaflow
    group: Developer & data tools
    lang: Python
    page: /projects/curaflow/
    summary: >-
      Incremental, parallel fetch → normalize → build pipeline for
      web-curated data, driven by one YAML manifest, with hierarchical
      fan-out, conditional GET and structural diffs.

  - repo: odsview-cli-python
    group: Developer & data tools
    lang: Python
    summary: A read-only LibreOffice Calc viewer for the terminal.

  - repo: ods2sql-python
    group: Developer & data tools
    lang: Python
    summary: One-file, pure-stdlib Python tool that converts instrumented LibreOffice .ods sheets into SQL for SQLite, Postgres or MySQL.

  - repo: typesketch-python
    title: TypeSketch
    group: Developer & data tools
    lang: Python
    page: /projects/typesketch-python/
    summary: >-
      A tiny, dependency-free CLI that reads JSON and infers a concise,
      type-oriented YAML sketch of its shape.

  - repo: dropin-cli-python
    group: Developer & data tools
    lang: Python
    summary: >-
      Drop-in Python module for building single-file CLIs: commands,
      JSON/YAML/table output, progress bars, thread-pool helpers.

  - repo: curator-seed-python
    group: Developer & data tools
    lang: Python
    summary: Quick start your first Software Curator project.
