<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body{% if page.accent %} style="--accent: {{ page.accent }}"{% endif %}>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="https://github.com/{{ site.github_user }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
      <span>Code on <a href="https://github.com/{{ site.github_user }}">GitHub</a> · site built with Jekyll on GitHub Pages</span>
    </div>
  </footer>
</body>
</html>
